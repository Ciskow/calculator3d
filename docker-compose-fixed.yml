services:
   homer:
    image: b4bz/homer
    container_name: homer
    restart: unless-stopped
    volumes:
      - /f/ciskowserver/config/homer:/www/assets
    ports:
      - 8080:8080
    user: 1000:1000
    environment:
      - TZ=America/Sao_Paulo
      - INIT_ASSETS=1

   roulette:
      build: /config/roulette
      pull_policy: build
      container_name: infinite-roulette
      restart: unless-stopped
      ports:
        - "5173:80" # Maps port 5173 on host to 80 in container
      environment:
        - VITE_ALLOWED_HOST=ciskowflix.duckdns.org

   homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    volumes:
      - /f/ciskowserver/config/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: bridge
    ports:
    - "8123:8123"

   financialApp:
    container_name: financial
    build:
      context: /config/financial/claude-code-team/app
      dockerfile: Dockerfile
    image: financial-app:latest
    pull_policy: build
    ports:
      - "8182:8182"
    environment:
      - PORT=8182
      - DATA_FILE_PATH=/data/db.json
    volumes:
      - /f/ciskowserver/config/financial/claude-code-team/app/data:/data
    restart: unless-stopped

   calculator3d:
    build: /config/calculator3d
    pull_policy: build
    container_name: calculator3d
    restart: unless-stopped
    ports:
      - "8380:80"
    environment:
      - PORT=80
      - DATA_FILE_PATH=/data/db.json
    volumes:
      - /f/ciskowserver/config/calculator3d/data:/data

